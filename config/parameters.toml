name = "lookback_1h_short"
value = 24
unit = "bars"
status = "fixed"
band = "none — calendar logic (1 day)"
used_by = ["all features on 1h"]
source_spec = "specs/02 §4"
justification = "One day of 1h bars. Calendar-anchored, not optimised."
overfitting_exposure = "none"

