# THE parameter registry. specs/02 §10, specs/03 §10, specs/04 §8, specs/05 §10, specs/08 §11.
#
# Hard cap: 30 (raised from 25 at specs/08 §11 as a deliberate, itemised decision).
# Adding one requires removing one or raising the cap in writing, with a justification per entry.
#
# `status` is load-bearing — nothing may mistake an uncalibrated value for a measured one:
#   fixed        Structural or conventional. NOT tunable. Never swept, never changed to fit results.
#   provisional  A placeholder inside the registered band so the system can run before Phase 16.
#                Phase 16 Stage 6 sweeps the band and sets the final value. Must not be presented
#                as calibrated, and `parameter_set_hash` records which value produced any signal.
#   unset        No value yet; the phase that sets it is named in `set_by`.
#   user         A risk-appetite choice belonging to the operator, not a property of the market.
#   conditional  Registered only if a named condition holds (see er_min).
#   judgment     A permanent judgment that no measurement can replace (specs/08 §11 registers
#                exactly one: unvalidated_multiplier). Swept for sensitivity, never "set" by a phase.
#
# `overfitting_exposure` is copied from the spec that registered the parameter.

cap = 30
version = "1.0.0"

# ---------------------------------------------------------------------------------------------
# 1-9 — Shared lookbacks. specs/02 §4. Calendar-anchored. DO NOT TUNE.
# "If a feature appears to need a different lookback, that is evidence about the feature,
#  not a licence to add a parameter."
